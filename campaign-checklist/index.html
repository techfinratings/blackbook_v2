<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마케팅 캠페인 운영 SOP v3.0</title>
<!--
  ============================================================================
  마케팅 캠페인 SOP — 모듈형 체크리스트 생성기 (단일 HTML 파일)
  ----------------------------------------------------------------------------
  · 외부 네트워크 요청 0건 (CDN / fetch / XHR / WebSocket 미사용)
  · localStorage / sessionStorage / IndexedDB 미사용 — 모든 상태는 JS 변수
  · Excel(.xlsx)은 라이브러리 없이 OOXML을 직접 생성 (스크립트 하단 참조)
  · 과업 데이터 수정: 아래 <script> 최상단의 "데이터 정의" 블록만 고치면 됨
  ============================================================================
-->
<style>
  :root{
    --tint:#EDF1F5; --tint2:#E0E6EC; --tint3:#D6DEE7; --accent:#3E5C76; --accent-d:#2E4759;
    --ink:#26303A; --ink-soft:#5B6773; --line:#E2E7EC; --bg:#E9EDF1; --white:#FFFFFF;
    --auto:#9A6700; --danger:#B54708;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{font-size:15px;}
  body{
    font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",Dotum,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5; padding-bottom:40px;
  }
  .wrap{max-width:1420px; margin:0 auto; padding:0 20px;}

  /* ── 헤더 ─────────────────────────────── */
  header{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-d) 100%); padding:14px 0 13px; box-shadow:0 2px 8px rgba(0,0,0,.1);}
  .head-inner{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  header h1{font-size:1.15rem; color:#FFFFFF; letter-spacing:-.02em;}
  header p{font-size:.76rem; color:#C9D6E2; margin-top:2px;}

  /* ── SOP 플로우 밴드 ───────────────────── */
  .sop-flow{
    display:flex; align-items:center; margin-top:14px; background:#fff; border:1px solid #EDF0F3;
    border-radius:12px; padding:13px 18px; overflow-x:auto;
    box-shadow:0 1px 2px rgba(16,24,40,.05), 0 2px 6px rgba(16,24,40,.06);
  }
  .sf-box{
    flex:1; min-width:84px; text-align:center; border-radius:8px; padding:10px 6px;
    font-weight:bold; font-size:.92rem; white-space:nowrap;
  }
  .sf-box span{display:block; font-weight:normal; font-size:.68rem; margin-top:2px; opacity:.85;}
  .sf-box.s1{background:#EDF1F5; color:#3E5C76;}
  .sf-box.s2{background:#D6DEE7; color:#33495D;}
  .sf-box.s3{background:#B9C9D8; color:#26303A;}
  .sf-box.s4{background:#6E8FAC; color:#FFFFFF;}
  .sf-box.s5{background:#3E5C76; color:#FFFFFF;}
  .sf-arrow{flex:none; width:80px; text-align:center; color:var(--ink-soft); font-size:.68rem; line-height:1.3;}
  .sf-arrow b{display:block; color:var(--accent-d); font-size:.95rem;}

  /* ── 카드 공통 ─────────────────────────── */
  section.card{
    background:var(--white); border:1px solid #EDF0F3; border-radius:12px; overflow:hidden;
    box-shadow:0 1px 2px rgba(16,24,40,.05), 0 2px 6px rgba(16,24,40,.06);
  }
  section.card > h2{
    font-size:.95rem; padding:11px 16px; background:#FFFFFF; border-bottom:1px solid var(--line); color:var(--ink);
    display:flex; align-items:center; gap:9px; flex-wrap:wrap;
  }
  section.card > h2 .step{
    background:var(--accent); color:#FFFFFF; font-size:.72rem; border-radius:20px; padding:1px 9px; font-weight:bold;
  }
  .card-body{padding:14px 16px 16px;}
  .hint{font-size:.75rem; color:var(--ink-soft); font-weight:normal;}

  /* ── 캠페인 정보 (상단 가로 바) ─────────── */
  #secInfo{margin-top:14px;}
  .info-grid{display:grid; grid-template-columns:2.2fr 1fr 1fr 1.3fr; gap:12px; align-items:start;}
  .field label{display:block; font-size:.78rem; font-weight:bold; margin-bottom:4px;}
  .field label .req{color:var(--danger);}
  .field input,.field select{
    width:100%; padding:7px 10px; border:1px solid var(--line); border-radius:6px; font:inherit; font-size:.87rem; background:#FFFFFF;
  }
  .field input:focus,.field select:focus{outline:2px solid var(--accent); border-color:var(--accent);}
  #budgetField{display:none;}
  #budgetField.visible{display:block;}
  #budgetField .why{font-size:.68rem; color:var(--auto); margin-top:3px;}

  /* ── 2단 레이아웃 ──────────────────────── */
  .layout{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.08fr); gap:16px; margin-top:14px; align-items:start;}
  .col-left{display:flex; flex-direction:column; gap:14px; min-width:0;}
  .col-right{position:sticky; top:14px; min-width:0;}

  /* ── 프리셋 (좌측, 세로 슬림) ───────────── */
  .preset-row{display:flex; flex-direction:column; gap:7px;}
  .preset-btn{
    display:flex; align-items:baseline; gap:10px; border:1.5px solid var(--line); background:#FBFCFD; border-radius:8px;
    padding:8px 12px; cursor:pointer; text-align:left; font:inherit; transition:all .12s;
  }
  .preset-btn:hover{border-color:var(--accent); background:var(--tint); box-shadow:0 2px 6px rgba(62,92,118,.14); transform:translateY(-1px);}
  .preset-btn.active{border-color:var(--accent-d); background:var(--tint2); box-shadow:0 0 0 2px var(--tint3);}
  .preset-btn .pk{background:var(--accent); color:#FFFFFF; font-weight:bold; font-size:.76rem; border-radius:4px; padding:0 7px; flex:none;}
  .preset-btn .pn{font-weight:bold; font-size:.85rem; white-space:nowrap;}
  .preset-btn .pd{font-size:.72rem; color:var(--ink-soft); line-height:1.35;}

  /* ── 모듈 체크박스 ─────────────────────── */
  .mod-stage{background:#F5F7FA; border:1px solid #E7EBEF; border-radius:10px; padding:10px 12px 12px; margin-bottom:10px;}
  .mod-stage:last-child{margin-bottom:0;}
  .mod-stage > h3{font-size:.82rem; color:var(--accent-d); border-left:4px solid var(--accent); padding-left:8px; margin-bottom:8px;}
  .mod-list{display:flex; flex-wrap:wrap; gap:7px;}
  .mod{
    display:inline-flex; align-items:center; gap:6px; border:1.5px solid var(--line); border-radius:7px;
    padding:6px 10px; background:#FFFFFF; cursor:pointer; user-select:none; font-size:.82rem; position:relative;
    box-shadow:0 1px 1px rgba(16,24,40,.04);
  }
  .mod:hover{border-color:var(--accent);}
  .mod input{accent-color:var(--accent-d); width:15px; height:15px; cursor:pointer;}
  .mod .code{font-weight:bold; color:var(--accent-d); font-size:.75rem;}
  .mod.checked{background:var(--tint2); border-color:var(--accent-d);}
  .mod.fixed{background:var(--tint3); border-color:var(--accent-d); cursor:not-allowed;}
  .mod.fixed .lock{font-size:.7rem;}
  .mod.auto{background:#FBF7EC; border-style:dashed; border-color:#C9A75C;}
  .mod .auto-badge{font-size:.66rem; background:var(--auto); color:#fff; border-radius:3px; padding:0 5px; cursor:help;}
  .auto-reasons{margin-top:10px; font-size:.74rem; color:var(--auto); background:#FBF7EC; border:1px dashed #D9C48A; border-radius:6px; padding:8px 12px; display:none;}
  .auto-reasons.visible{display:block;}
  .auto-reasons li{margin-left:16px;}

  /* ── 채널 패널 ─────────────────────────── */
  .channel-panel{margin-top:11px; border:1px solid var(--line); border-radius:8px; background:#FFFFFF; padding:11px 13px; box-shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 1px 2px rgba(16,24,40,.04);}
  .channel-panel > h4{font-size:.8rem; margin-bottom:3px;}
  .channel-panel > .hint{margin-bottom:7px; display:block;}
  .ch-group{margin-top:7px;}
  .ch-group > span{font-size:.72rem; font-weight:bold; color:var(--ink-soft); display:block; margin-bottom:4px;}
  .ch-list{display:flex; flex-wrap:wrap; gap:6px;}
  .ch{
    display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line); border-radius:6px;
    padding:4px 8px; background:#fff; cursor:pointer; font-size:.77rem; user-select:none;
  }
  .ch:hover{border-color:var(--accent);}
  .ch.checked{background:var(--tint2); border-color:var(--accent-d);}
  .ch input{accent-color:var(--accent-d); cursor:pointer;}
  .ch .code{font-weight:bold; color:var(--accent-d); font-size:.7rem;}

  /* ── 우측 결과 패널 ────────────────────── */
  .result-panel{
    display:flex; flex-direction:column; max-height:calc(100vh - 28px);
    border-top:3px solid var(--accent);
    box-shadow:0 2px 4px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.12);
  }
  .result-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 14px; background:linear-gradient(180deg,#F2F5F9,#EAEFF4); border-bottom:1px solid var(--line); flex:none;
  }
  .tabs{display:flex; gap:6px;}
  .tab{
    font:inherit; font-size:.84rem; font-weight:bold; border:1.5px solid var(--line); background:#fff;
    border-radius:7px; padding:6px 14px; cursor:pointer; color:var(--ink-soft);
  }
  .tab:hover{border-color:var(--accent); color:var(--accent-d);}
  .tab.active{background:var(--accent); border-color:var(--accent-d); color:#fff;}
  .tab .cnt{font-weight:normal; font-size:.74rem; opacity:.85;}
  button.dl{
    background:linear-gradient(135deg,var(--accent),var(--accent-d)); color:#FFFFFF; border:none; border-radius:7px;
    font:inherit; font-weight:bold; font-size:.85rem; padding:8px 18px; cursor:pointer; box-shadow:0 2px 6px rgba(62,92,118,.3);
    white-space:nowrap;
  }
  button.dl:hover{filter:brightness(1.08);}
  button.dl:active{transform:translateY(1px);}
  .result-meta{padding:8px 12px 0; flex:none;}
  .preview-stats{font-size:.78rem; color:var(--ink-soft);}
  .preview-stats b{color:var(--accent-d); font-size:.95rem;}
  .dl-file{font-size:.73rem; color:var(--ink-soft); margin-top:2px;}
  .dl-msg{font-size:.76rem; color:var(--danger); margin-top:2px;}
  .notice{font-size:.75rem; background:#EEF3F7; border:1px solid #C7D2DD; color:#33495D; border-radius:6px; padding:6px 11px; margin:7px 12px 0; display:none; flex:none;}
  .notice.visible{display:block;}
  .tab-pane{flex:1; overflow:auto; padding:12px 14px 14px; min-height:200px; background:#F4F6F9;}

  /* ── 미리보기 표 ───────────────────────── */
  .tbl-scroll{overflow-x:auto; border:1px solid var(--line); border-radius:8px; background:#fff; box-shadow:0 1px 3px rgba(16,24,40,.07);}
  table.preview{border-collapse:collapse; width:100%; font-size:.76rem; background:#fff;}
  table.preview th{
    background:var(--tint3); color:#26303A; padding:6px 7px; border:1px solid var(--line);
    position:sticky; top:0; white-space:nowrap; font-size:.74rem; z-index:1;
  }
  table.preview td{border:1px solid var(--line); padding:5px 7px; vertical-align:top;}
  td.stage-cell{font-weight:bold; text-align:center; vertical-align:middle; white-space:nowrap; width:46px;}
  td.no-cell{white-space:nowrap; color:var(--ink-soft); font-size:.71rem; width:52px; text-align:center;}
  td.task-cell{font-weight:bold; white-space:nowrap;}
  td.status-cell{text-align:center; color:#8A8A8A; white-space:nowrap;}
  td.note-cell{color:var(--ink-soft); font-size:.71rem;}
  td.editable{background:#F7F9FB; cursor:text; min-width:76px;}
  td.editable:focus{outline:2px solid var(--accent); background:#fff;}
  td.editable:empty::before{content:'—'; color:#C9BD97;}
  tr.auto-row td.no-cell::after{content:' ⚙'; color:var(--auto);}
  tr.custom-row td{background:#FDFCF7;}
  .ct-del{border:none; background:none; color:#B54708; cursor:pointer; font-size:.72rem; padding:0 2px;}
  .ct-del:hover{font-weight:bold;}
  tr.ct-add td{border:1px dashed var(--line); background:#FAFBFC; padding:2px 6px;}
  .ct-add-btn{
    font:inherit; font-size:.72rem; color:var(--accent-d); background:none; border:none; cursor:pointer; padding:2px 4px;
  }
  .ct-add-btn:hover{text-decoration:underline;}
  .empty-msg{padding:28px; text-align:center; color:var(--ink-soft); font-size:.83rem;}

  /* ── 로드맵 캘린더 ─────────────────────── */
  .cal-legend{display:flex; gap:10px; flex-wrap:wrap; font-size:.72rem; margin-bottom:9px; align-items:center; color:var(--ink-soft);}
  .cal-legend .lg{display:inline-flex; align-items:center; gap:4px;}
  .cal-legend .sw{width:11px; height:11px; border-radius:3px; display:inline-block; border:1px solid rgba(0,0,0,.08);}
  .cal-month{margin-bottom:15px;}
  .cal-month h4{font-size:.86rem; margin-bottom:5px; color:var(--accent-d);}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); border-left:1px solid var(--line); border-top:1px solid var(--line); border-radius:6px; overflow:hidden; background:#fff; box-shadow:0 1px 3px rgba(16,24,40,.07);}
  .cal-dow{background:var(--tint2); font-size:.7rem; text-align:center; padding:3px 0; font-weight:bold; border-right:1px solid var(--line); border-bottom:1px solid var(--line);}
  .cal-day{min-height:56px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:2px 3px; background:#fff;}
  .cal-day .dn{font-size:.7rem; color:var(--ink-soft);}
  .cal-day.out{background:#F7F8FA;}
  .cal-day.out .dn{color:#C5CCD3;}
  .cal-day.in-period{background:#F1F6FA;}
  .cal-day.today{outline:2px solid var(--accent); outline-offset:-2px;}
  .cal-day.sun > .dn{color:#C25450;}
  .cal-day.sat > .dn{color:#4A7CB5;}
  .cal-chip{
    display:block; border-radius:3px; padding:0 4px; margin-top:2px; font-size:.66rem; line-height:1.5;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:help; color:#26303A;
  }
  .cal-flag{display:block; margin-top:2px; font-size:.68rem; font-weight:bold; color:var(--accent-d); white-space:nowrap;}
  .cal-chip[draggable="true"]{cursor:grab;}
  .cal-chip[draggable="true"]:active{cursor:grabbing;}
  .cal-day.dragover{outline:2px dashed var(--accent); outline-offset:-2px; background:#E9F1F8;}

  /* ── 요청 쪽지 (우측 패널 내 1열) ────────── */
  .note-grid{display:grid; grid-template-columns:1fr; gap:11px;}
  .note-card{border:1px solid var(--line); border-radius:8px; background:#FFFFFF; overflow:hidden; box-shadow:0 1px 3px rgba(16,24,40,.07);}
  .note-head{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:7px 11px; background:var(--tint); border-bottom:1px solid var(--line);}
  .note-head b{font-size:.83rem;}
  .note-head .to{font-size:.7rem; color:var(--ink-soft);}
  .note-btns{display:flex; gap:6px;}
  .note-btns button{
    font:inherit; font-size:.72rem; border:1px solid var(--line); background:#fff; border-radius:5px;
    padding:3px 9px; cursor:pointer; white-space:nowrap;
  }
  .note-btns button:hover{border-color:var(--accent); color:var(--accent-d);}
  .note-btns button.copied{background:var(--accent); color:#fff; border-color:var(--accent);}
  .note-card textarea{
    width:100%; border:none; background:transparent; font:inherit; font-size:.78rem; line-height:1.5;
    padding:9px 11px; min-height:210px; resize:vertical; color:var(--ink);
  }
  .note-card textarea:focus{outline:2px solid var(--accent); background:#fff;}
  .note-edited{font-size:.66rem; color:var(--auto);}

  /* ── 반응형 ───────────────────────────── */
  @media (max-width:1100px){
    .layout{grid-template-columns:1fr;}
    .col-right{position:static;}
    .result-panel{max-height:none;}
    .info-grid{grid-template-columns:repeat(2,1fr);}
  }

  /* ── 인쇄: 체크리스트만 ─────────────────── */
  @media print{
    header,#secInfo,.col-left,.result-head,.result-meta,.notice,#paneNotes{display:none !important;}
    body{background:#fff; padding:0;}
    .layout{display:block; margin:0;}
    .col-right{position:static;}
    section.card{border:none;}
    .result-panel{max-height:none;}
    .tab-pane{overflow:visible; padding:0;}
    #panePreview{display:block !important;}
    .tbl-scroll{overflow:visible; border:none;}
    table.preview th{position:static;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap head-inner">
    <div>
      <h1>마케팅 캠페인 운영 SOP <small style="font-weight:normal;font-size:.75rem;">v3.0</small></h1>
      <p>마케팅 이벤트를 기획 → 디자인 → 개발요청 → 백오피스운영 → 오픈/사후관리 진행을 위한 표준 가이드 · 사업전략팀</p>
    </div>
  </div>
</header>

<div class="wrap">

  <!-- SOP 진행 플로우 (기획→디자인→개발→검수→오픈) -->
  <div class="sop-flow">
    <div class="sf-box s1">기획<span>1주차</span></div>
    <div class="sf-arrow"><b>→</b>초안 전달</div>
    <div class="sf-box s2">디자인<span>2주차</span></div>
    <div class="sf-arrow"><b>→</b>시안 확정</div>
    <div class="sf-box s3">개발<span>3주차</span></div>
    <div class="sf-arrow"><b>→</b>QA</div>
    <div class="sf-box s4">검수<span>4주차</span></div>
    <div class="sf-arrow"><b>→</b>사전 준비 완료</div>
    <div class="sf-box s5">오픈<span>D-Day</span></div>
  </div>

  <!-- 캠페인 정보 (상단 가로 바) -->
  <section class="card" id="secInfo">
    <h2><span class="step">STEP 1</span> 캠페인 정보</h2>
    <div class="card-body">
      <div class="info-grid">
        <div class="field">
          <label>캠페인명 <span class="req">*</span></label>
          <input type="text" id="inpName" placeholder="예) 2026 하반기 신규가입 이벤트" maxlength="60">
        </div>
        <div class="field">
          <label>시작일 <span class="req">*</span></label>
          <input type="date" id="inpStart">
        </div>
        <div class="field">
          <label>종료일 <span class="req">*</span></label>
          <input type="date" id="inpEnd">
        </div>
        <div class="field" id="budgetField">
          <label>예산 총액 (원)</label>
          <input type="number" id="inpBudget" min="0" step="10000" placeholder="예) 3000000">
          <div class="why">※ P3(예산 수립) 선택 시 표시</div>
        </div>
      </div>
    </div>
  </section>

  <!-- 좌: 설정 / 우: 결과 -->
  <div class="layout">

    <div class="col-left">
      <section class="card" id="secPreset">
        <h2><span class="step">STEP 2</span> 프리셋 <span class="hint">클릭 시 일괄 선택 · 이후 개별 수정 가능</span></h2>
        <div class="card-body">
          <div class="preset-row" id="presetRow"></div>
        </div>
      </section>

      <section class="card" id="secModule">
        <h2><span class="step">STEP 3</span> 모듈·채널 선택 <span class="hint">🔒 고정 · ⚙ 자동 체크(해제 가능, 해제 시 경고)</span></h2>
        <div class="card-body">
          <div id="moduleArea"></div>
          <ul class="auto-reasons" id="autoReasons"></ul>
        </div>
      </section>
    </div>

    <aside class="col-right">
      <section class="card result-panel" id="secResult">
        <div class="result-head">
          <div class="tabs">
            <button type="button" class="tab active" data-tab="preview">📋 체크리스트 <span class="cnt" id="tabCntPrev"></span></button>
            <button type="button" class="tab" data-tab="roadmap">🗓 로드맵</button>
            <button type="button" class="tab" data-tab="notes">✉ 요청 쪽지 <span class="cnt" id="tabCntNotes"></span></button>
          </div>
          <button class="dl" id="btnDownload">⬇ Excel 다운로드</button>
        </div>
        <div class="result-meta">
          <div class="preview-stats" id="previewStats"></div>
          <div class="dl-file" id="dlFileName">파일명: (캠페인명 입력 시 표시)</div>

function channelTaskText(ch, s){

  if(s.dyn === 'end'){
    if(ch.type === '광고')   return '집행 상태 확인 → 종료 시 광고 중단';
    return '게시 확인 → 종료 후 내림';

}

/* ── 기한(D-) 기본값 — 단계별 시작일 역산 (준비 4주 미만 시 비율 압축) ── */
const STAGE_ORDER = ['기획','디자인','개발','검수','오픈'];
const STAGE_DDAY  = {'기획':28,'디자인':21,'개발':14,'검수':7,'오픈':0};
const BASE_PREP_DAYS = 28; // 기준 준비 기간(4주)

/* ═══════════════════════════════════════════════════════════════════════════
   [상태] — 모든 상태는 JS 변수로만 관리 (스토리지 미사용)
   ═══════════════════════════════════════════════════════════════════════════ */
const state = {
  manual:   new Set(),      // 사용자가 직접 체크한 선택 모듈
  excluded: new Set(),      // 자동 체크를 사용자가 명시적으로 해제한 모듈
  channels: new Set(),      // 선택된 노출 채널 (C코드)
  overrides: new Map(),     // 행별 수정값: uid → {dept, due}
  noteOverrides: new Map(), // 요청 쪽지 수정본: noteId → text
  customTasks: [],          // 수기 추가 과업: {uid, no, stage, task, checklist, dept, due, note}
  ctSeq: 1,
  activePreset: null,
};

/* 종속 규칙 폐쇄(fixpoint) 계산
   → {active:Set, reasons:Map(code→[사유]), suppressed:Map(code→[사유])}
   suppressed = 규칙상 자동 체크 대상이지만 사용자가 해제한 모듈(경고 표시용) */
function computeEffective(){
  const active = new Set([...FIXED_MODULES, ...state.manual].filter(c => !state.excluded.has(c) || FIXED_MODULES.includes(c)));
  const reasons = new Map();
  const suppressed = new Map();
  let changed = true;
  while(changed){
    changed = false;
    for(const r of DEP_RULES){
      const hit =
        (r.anyModules  && r.anyModules.some(m => active.has(m))) ||
        (r.anyChannels && r.anyChannels.some(c => state.channels.has(c)));
      if(!hit) continue;
      for(const t of r.add){
        if(state.excluded.has(t)){
          const list = suppressed.get(t) || [];
          if(!list.includes(r.why)) list.push(r.why);
          suppressed.set(t, list);
          continue;
        }
        if(!active.has(t)){ active.add(t); changed = true; }
        if(!state.manual.has(t) && !FIXED_MODULES.includes(t)){
          const list = reasons.get(t) || [];
          if(!list.includes(r.why)) list.push(r.why);
          reasons.set(t, list);
        }
      }
    }
  }
  return {active, reasons, suppressed};
}

/* ── 기한 계산 ── */
function parseDate(v){ return v ? new Date(v + 'T00:00:00') : null; }
function fmtMD(d){ return String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0'); }
function prepInfo(){
  const start = parseDate(document.getElementById('inpStart').value);
  if(!start) return {start:null, scale:1, prepDays:null};
  const today = new Date(); today.setHours(0,0,0,0);
  const prepDays = Math.round((start - today) / 86400000);
  let scale = 1;
  if(prepDays > 0 && prepDays < BASE_PREP_DAYS) scale = prepDays / BASE_PREP_DAYS;
  return {start, scale, prepDays};
}
function defaultDue(stage, pi){
  const base = STAGE_DDAY[stage];
  const n = Math.max(0, Math.round(base * pi.scale));
  const label = n === 0 ? 'D-Day' : 'D-' + n;
  if(!pi.start) return label;
  const d = new Date(pi.start); d.setDate(d.getDate() - n);
  return label + ' (' + fmtMD(d) + ')';
}

/* ── 체크리스트 행 생성 (미리보기·Excel 공용 모델) ──
   행: {stage, no, task, checklist, dept, due, status, note, uid, auto} */
function buildRows(){
  const {active, reasons} = computeEffective();
  const pi = prepInfo();
  const rows = [];
  const selCh = CHANNELS.filter(c => state.channels.has(c.code));

  const push = (stage, no, task, checklist, dept, note, uid) => {
    const ov = state.overrides.get(uid) || {};
    rows.push({
      stage, no, task, checklist,
      dept: ov.dept !== undefined ? ov.dept : dept,
      due:  ov.due  !== undefined ? ov.due  : defaultDue(stage, pi),
      status:'미착수', note, uid,
      auto: reasons.has(uid.split('-')[0]) // 시각 표시용(모듈 단위)
    });
  };
  const pushModule = (stage, code) => {
    if(!active.has(code)) return;
    for(const [no, task, checklist, dept, note] of TASKS[code]){
      const ov = state.overrides.get(no) || {};
      rows.push({
        stage, no, task, checklist,
        dept: ov.dept !== undefined ? ov.dept : dept,
        due:  ov.due  !== undefined ? ov.due  : defaultDue(stage, pi),
        status:'미착수', note: note || '', uid: no,
        auto: reasons.has(code),
      });
    }
  };

  // 선택된 채널의 해당 단계 과업 일괄 배치
  const pushChannelStage = stage => {
    for(const ch of selCh){
      for(const s of CHANNEL_TASK_SET.filter(x => x.stage === stage)){
        const checklist = channelTaskText(ch, s);
        const dept = s.dept === 'PUBLISHER' ? ch.publisher : s.dept;
        const note = ch.note ? ch.type + ' · ' + ch.note : ch.type;
        push(stage, ch.code+'-'+s.seq, ch.name, checklist, dept, note, ch.code+'-s'+s.seq);
      }
    }
  };

  // 수기 추가 과업 (해당 단계 끝에 배치)
  const pushCustom = stage => {
    for(const ct of state.customTasks.filter(c => c.stage === stage)){
      rows.push({stage, no:ct.no, task:ct.task, checklist:ct.checklist, dept:ct.dept,
                 due:ct.due, status:'미착수', note:ct.note, uid:ct.uid, auto:false, custom:true});
    }
  };

  // 기획 (채널 노출 확정 포함)
  ['P0','P1','P2','P3','P4','P5','P7','P8','P10'].forEach(c => pushModule('기획', c));
  pushChannelStage('기획');
  pushCustom('기획');
  // 디자인
  ['D1','D2','D3','D4','D5','D6','D7'].forEach(c => pushModule('디자인', c));
  pushChannelStage('디자인');
  pushCustom('디자인');
  // 개발
  ['V1','V2','V3','V4'].forEach(c => pushModule('개발', c));
  pushChannelStage('개발');
  pushCustom('개발');
  // 검수 (자동 구성)
  let qa = 0;
  for(const ins of INSPECTIONS){
    const on = ins.trigger === 'ALWAYS'
      || (ins.trigger === 'CH' && ins.channels.some(c => state.channels.has(c)))
      || (Array.isArray(ins.trigger) && ins.trigger.some(m => active.has(m)));
    if(!on) continue;
    qa++;
    push('검수', 'QA-'+qa, ins.trigger === 'ALWAYS' ? '공통 검수' :
      (ins.trigger === 'CH' ? '제휴 검수' : ins.trigger.join('·')+' 검수'),
      ins.text, ins.dept, ins.note, 'QA:'+ins.text);
  }
  pushChannelStage('검수');
  pushCustom('검수');
  // 오픈
  ['O1','O2','O3','O4'].forEach(c => pushModule('오픈', c));
  pushChannelStage('오픈');
  pushCustom('오픈');
  return {rows, active, reasons, pi};
}

const $ = id => document.getElementById(id);
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderPresets(){
  $('presetRow').innerHTML = PRESETS.map(p => `
    <button type="button" class="preset-btn${state.activePreset===p.key?' active':''}" data-preset="${p.key}">
      <span class="pk">${p.key}</span>
      <span class="pn">${esc(p.name)}</span>
      <span class="pd">${esc(p.desc)}</span>
    </button>`).join('');
}

function renderModules(){
  const {active, reasons, suppressed} = computeEffective();
  const groups = ['기획','디자인','개발','오픈'];
  let html = '';
  for(const g of groups){
    html += `<div class="mod-stage"><h3>${g} 단계</h3><div class="mod-list">`;
    for(const m of MODULES.filter(x => x.stage === g)){
      const checked = active.has(m.code);
      const isFixed = m.kind === 'fixed';
      const isAuto  = checked && !isFixed && !state.manual.has(m.code);
      const reason  = isAuto ? (reasons.get(m.code)||[]).join(' / ') : '';
      html += `
        <label class="mod${checked?' checked':''}${isFixed?' fixed':''}${isAuto?' auto':''}"
               ${reason ? `title="${esc(reason)}"` : ''}>
          <input type="checkbox" data-mod="${m.code}" ${checked?'checked':''} ${isFixed?'disabled':''}>
          <span class="code">${m.code}</span> ${esc(m.name)}
          ${isFixed ? '<span class="lock">🔒</span>' : ''}
          ${isAuto ? `<span class="auto-badge" title="${esc(reason)}">자동</span>` : ''}
        </label>`;
    }
    // P1 아래 채널 패널 (기획 그룹 끝에 배치)
    html += '</div>';
    if(g === '기획'){
      html += `<div class="channel-panel">
        <h4>📡 노출 채널 선택 <span class="hint">(P1 하위 · 기획 단계에서 함께 확정 — 선택 시 [노출 확정→게시·집행→검수→종료] 과업 배치 + 배너·팝업·광고 소재 등 연동 디자인 모듈 자동 체크)</span></h4>
        <div class="hint">※ 채널마다 진행 절차가 다름(협조전·변경 요청·광고 세팅 등) — 목록 변경 시 코드 상단 CHANNELS 배열만 갱신</div>`;
      const types = [...new Set(CHANNELS.map(c => c.type))];
      for(const t of types){
        html += `<div class="ch-group"><span>${esc(t)}</span><div class="ch-list">`;
        for(const c of CHANNELS.filter(x => x.type === t)){
          const on = state.channels.has(c.code);
          html += `
            <label class="ch${on?' checked':''}" title="게시 주체: ${esc(c.publisher)}${c.note ? ' · ' + esc(c.note) : ''}">
              <input type="checkbox" data-ch="${c.code}" ${on?'checked':''}>
              <span class="code">${c.code}</span> ${esc(c.name)}
            </label>`;
        }
        html += '</div></div>';
      }
      html += '</div>';
    }
    html += '</div>';
  }
  $('moduleArea').innerHTML = html;

  // 자동 체크 사유 + 해제된 권장 모듈 경고
  const items = [...reasons.entries()].filter(([code]) => active.has(code));
  const warns = [...suppressed.entries()];
  const box = $('autoReasons');
  if(items.length || warns.length){
    box.classList.add('visible');
    box.innerHTML =
      (items.length ? '<b>⚙ 자동 체크 사유</b>' +
        items.map(([code, why]) => `<li><b>${code}</b> — ${esc(why.join(' / '))} <span class="hint">(체크 해제 시 자동 선택에서 제외됨)</span></li>`).join('') : '') +
      (warns.length ? '<b style="color:#B54708;">⚠ 종속 규칙 권장 모듈이 해제되어 있습니다 — 누락 여부를 확인하세요</b>' +
        warns.map(([code, why]) => `<li style="color:#B54708;"><b>${code}</b> — ${esc(why.join(' / '))} <span class="hint">(다시 체크하면 복원)</span></li>`).join('') : '');
  }else{
    box.classList.remove('visible'); box.innerHTML = '';
  }

  // R8: P2 선택 시 예산 입력란 표시
  $('budgetField').classList.toggle('visible', active.has('P3'));
}

function renderPreview(){
  const {rows, active, pi} = buildRows();
  const chCount = state.channels.size;
  $('tabCntPrev').textContent = rows.length ? `(${rows.length})` : '';
  $('previewStats').innerHTML =
    `총 <b>${rows.length}</b>개 과업 · 모듈 <b>${[...active].length}</b>개 · 채널 <b>${chCount}</b>개` +
    STAGE_ORDER.map(s => {
      const n = rows.filter(r => r.stage === s).length;
      return n ? ` · ${s} ${n}` : '';
    }).join('');

  // 준비 기간 압축 안내
  const notice = $('compressNotice');
  if(pi.start && pi.prepDays !== null && pi.prepDays < BASE_PREP_DAYS){
    notice.classList.add('visible');
    notice.textContent = pi.prepDays <= 0
      ? `⚠ 시작일이 오늘 이전입니다. 기한(D-)을 직접 조정하세요.`
      : `⏱ 준비 기간 ${pi.prepDays}일 (기준 ${BASE_PREP_DAYS}일 미만) — 기한(D-) 기본값을 ${Math.round(pi.scale*100)}% 비율로 압축했습니다. 행별로 직접 수정 가능합니다.`;
  }else{
    notice.classList.remove('visible');
  }

  if(!rows.length){
    $('previewBox').innerHTML = '<div class="empty-msg">모듈을 선택하면 체크리스트가 여기에 표시됩니다.</div>';
    return;
  }
  // 단계 셀 rowspan 계산
  let html = `<table class="preview"><thead><tr>
    <th>단계</th><th>NO.</th><th>과업</th><th>체크리스트</th><th>협업부서</th><th>기한(D-)</th><th>상태</th><th>비고</th>
  </tr></thead><tbody>`;
  for(let i = 0; i < rows.length; i++){
    const r = rows[i];
    const first = i === 0 || rows[i-1].stage !== r.stage;
    let span = 1;
    if(first){ while(i + span < rows.length && rows[i+span].stage === r.stage) span++; }
    html += `<tr${r.auto ? ' class="auto-row"' : ''}${r.custom ? ' class="custom-row"' : ''}>`;
    if(first) html += `<td class="stage-cell" rowspan="${span}" style="background:${stageColor(r.stage)}">${r.stage}</td>`;
    if(r.custom){
      html += `
      <td class="no-cell">✎ <button class="ct-del" data-del="${esc(r.uid)}" title="행 삭제">✕</button></td>
      <td class="task-cell editable" contenteditable="true" data-uid="${esc(r.uid)}" data-field="task">${esc(r.task)}</td>
      <td class="editable" contenteditable="true" data-uid="${esc(r.uid)}" data-field="checklist">${esc(r.checklist)}</td>
      <td class="editable" contenteditable="true" data-uid="${esc(r.uid)}" data-field="dept">${esc(r.dept)}</td>
      <td class="editable" contenteditable="true" data-uid="${esc(r.uid)}" data-field="due">${esc(r.due)}</td>
      <td class="status-cell">${r.status}</td>
      <td class="note-cell editable" contenteditable="true" data-uid="${esc(r.uid)}" data-field="note">${esc(r.note)}</td>
    </tr>`;
    }else{
      html += `
      <td class="no-cell">${esc(r.no)}</td>
      <td class="task-cell">${esc(r.task)}</td>
      <td>${esc(r.checklist)}</td>
      <td class="editable" contenteditable="true" data-uid="${esc(r.uid)}" data-field="dept">${esc(r.dept)}</td>
      <td class="editable" contenteditable="true" data-uid="${esc(r.uid)}" data-field="due">${esc(r.due)}</td>
      <td class="status-cell">${r.status}</td>
      <td class="note-cell">${esc(r.note)}</td>
    </tr>`;
    }
    // 단계 그룹 끝: 수기 추가 버튼
    if(i === rows.length - 1 || rows[i+1].stage !== r.stage){
      html += `<tr class="ct-add"><td colspan="8"><button type="button" class="ct-add-btn" data-addstage="${esc(r.stage)}">＋ ${esc(r.stage)} 단계에 과업 직접 추가</button></td></tr>`;
    }
  }
  html += '</tbody></table>';
  $('previewBox').innerHTML = html;

  // 파일명 미리표시
  const nm = $('inpName').value.trim();
  $('dlFileName').textContent = '파일명: ' + (nm ? excelFileName(nm) : '(캠페인명 입력 시 표시)');

  renderNotes();
  renderRoadmap();
}

function stageColor(stage){
  return {'기획':'#EDF1F5','디자인':'#E0E6EC','개발':'#EDF1F5','검수':'#D6DEE7','오픈':'#C7D2DD'}[stage] || '#EDF1F5';
}

/* ═══════════════════════════════════════════════════════════════════════════
   [요청 쪽지 자동 생성] — 선택 모듈·채널·일정 기반 수신처별 쪽지 초안
   문구 수정은 아래 buildNotes() 안의 템플릿 문자열만 고치면 됨
   ═══════════════════════════════════════════════════════════════════════════ */
function dueDateText(stageN){
  const pi = prepInfo();
  const n = Math.max(0, Math.round(stageN * pi.scale));
  if(!pi.start) return `D-${n}`;
  const d = new Date(pi.start); d.setDate(d.getDate() - n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} (D-${n})`;
}

  return notes;

function renderNotes(){
  const notes = buildNotes();
  $('tabCntNotes').textContent = notes.length ? `(${notes.length})` : '';
  const box = $('notesArea');
  if(!notes.length){
    box.innerHTML = '<div class="empty-msg" style="grid-column:1/-1;">모듈·채널을 선택하면 필요한 요청 쪽지가 자동 생성됩니다.</div>';
    return;
  }
  box.innerHTML = notes.map(n => {
    const edited = state.noteOverrides.has(n.id);
    const body = edited ? state.noteOverrides.get(n.id) : n.body;
    return `<div class="note-card">
      <div class="note-head">
        <div><b>${esc(n.title)}</b> <span class="to">→ ${esc(n.to)}</span> ${edited ? '<span class="note-edited">✎ 수정됨</span>' : ''}</div>
        <div class="note-btns">
          <button type="button" data-regen="${n.id}" title="자동 생성 내용으로 되돌리기">↺</button>
          <button type="button" data-copy="${n.id}">📋 복사</button>
        </div>
      </div>
      <textarea data-note="${n.id}" spellcheck="false">${esc(body)}</textarea>
    </div>`;
  }).join('');
}

/* ── 로드맵(캘린더) 렌더링 — 행별 기한(D-)을 날짜로 환산해 월간 캘린더에 배치 ── */
function renderRoadmap(){
  const box = $('roadmapArea');
  const start = parseDate($('inpStart').value);
  const end   = parseDate($('inpEnd').value);
  if(!start){
    box.innerHTML = '<div class="empty-msg">시작일을 입력하면 단계별 일정이 캘린더로 표시됩니다.</div>';
    return;
  }
  const {rows} = buildRows();
  const pi = prepInfo();
  const key = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

  // 행 → 날짜 배정: 기한 텍스트의 D-n 해석 (수정분 반영), '종료 후' 과업은 종료일 배치
  const byDate = new Map(); // key → Map(버킷 → {labels, uids, after})
  for(const r of rows){
    let d, after = false;
    if(end && r.note.includes('종료 후')){
      d = new Date(end); after = true;
    }else if(/D\+(\d+)/.test(r.due)){
      const k2 = +/D\+(\d+)/.exec(r.due)[1];
      d = new Date(start); d.setDate(d.getDate() + k2);
    }else if(/D-?Day/i.test(r.due)){
      d = new Date(start);
    }else{
      const m = /D-(\d+)/.exec(r.due);
      const n = m ? +m[1] : Math.max(0, Math.round((STAGE_DDAY[r.stage] || 0) * pi.scale));
      d = new Date(start); d.setDate(d.getDate() - n);
    }
    const k = key(d);
    if(!byDate.has(k)) byDate.set(k, new Map());
    const stages = byDate.get(k);
    const bucket = r.stage + (after ? '†' : '');
    if(!stages.has(bucket)) stages.set(bucket, {labels:[], uids:[], after});
    const g = stages.get(bucket);
    g.labels.push(`${r.no} ${r.task || r.checklist}`);
    g.uids.push(r.uid);
  }

  // 표시 범위: 가장 이른 기한 ~ 종료일(없으면 시작일)
  let minD = new Date(start), maxD = new Date(end || start);
  for(const k of byDate.keys()){
    const d = new Date(k + 'T00:00:00');
    if(d < minD) minD = d;
    if(d > maxD) maxD = d;
  }
  const today = new Date(); today.setHours(0,0,0,0);
  const startK = key(start), endK = end ? key(end) : null, todayK = key(today);

  // 범례
  let html = '<div class="cal-legend">' +
    STAGE_ORDER.map(st => `<span class="lg"><span class="sw" style="background:${stageColor(st)}"></span>${st}</span>`).join('') +
    '<span class="lg">🚀 오픈</span><span class="lg">🏁 종료·종료 후 과업</span>' +
    '<span class="lg"><span class="sw" style="background:#F1F6FA"></span>캠페인 기간</span></div>';

  // 월별 캘린더 (최대 6개월)
  const cur = new Date(minD.getFullYear(), minD.getMonth(), 1);
  const last = new Date(maxD.getFullYear(), maxD.getMonth(), 1);
  let guard = 0;
  while(cur <= last && guard++ < 6){
    html += `<div class="cal-month"><h4>${cur.getFullYear()}년 ${cur.getMonth()+1}월</h4><div class="cal-grid">`;
    html += ['일','월','화','수','목','금','토'].map(d => `<div class="cal-dow">${d}</div>`).join('');
    const firstDow = new Date(cur.getFullYear(), cur.getMonth(), 1).getDay();
    const daysInMonth = new Date(cur.getFullYear(), cur.getMonth()+1, 0).getDate();
    const cells = firstDow + daysInMonth;
    const totalCells = Math.ceil(cells / 7) * 7;
    for(let i = 0; i < totalCells; i++){
      const dayNum = i - firstDow + 1;
      if(dayNum < 1 || dayNum > daysInMonth){
        html += '<div class="cal-day out"><span class="dn"></span></div>';
        continue;
      }
      const d = new Date(cur.getFullYear(), cur.getMonth(), dayNum);
      const k = key(d);
      const dow = d.getDay();
      const inPeriod = end && k >= startK && k <= endK;
      const cls = ['cal-day', dow === 0 ? 'sun' : '', dow === 6 ? 'sat' : '',
                   inPeriod ? 'in-period' : '', k === todayK ? 'today' : ''].filter(Boolean).join(' ');
      html += `<div class="${cls}" data-date="${k}"><span class="dn">${dayNum}</span>`;
      if(k === startK) html += '<span class="cal-flag">🚀 오픈</span>';
      if(endK && k === endK) html += '<span class="cal-flag">🏁 종료</span>';
      const stages = byDate.get(k);
      if(stages){
        for(const st of STAGE_ORDER){
          for(const suffix of ['', '†']){
            const g = stages.get(st + suffix);
            if(!g) continue;
            const drag = g.after ? '' : ` draggable="true" data-uids="${esc(g.uids.join(','))}"`;
            html += `<span class="cal-chip"${drag} style="background:${stageColor(st)}" title="${esc(g.labels.slice(0,20).join('\n'))}${g.labels.length > 20 ? ' …' : ''}">${esc(st + ' ' + g.labels.length)}${g.after ? ' (종료 후)' : ''}</span>`;
          }
        }
      }
      html += '</div>';
    }
    html += '</div></div>';
    cur.setMonth(cur.getMonth() + 1);
  }
  html += '<div class="hint">※ 칩을 <b>마우스로 끌어 다른 날짜에 놓으면</b> 해당 과업들의 기한이 그 날짜로 이동합니다(체크리스트·Excel에 즉시 반영). 칩에 마우스를 올리면 과업 목록이 표시됩니다. \'종료 후\' 과업(발표·발송·리포트)은 종료일에 고정 배치됩니다.</div>';
  box.innerHTML = html;
}

async function copyNoteText(id, btn){
  const ta = document.querySelector(`textarea[data-note="${id}"]`);
  if(!ta) return;
  let ok = false;
  try{ await navigator.clipboard.writeText(ta.value); ok = true; }
  catch(e){
    ta.select();
    try{ ok = document.execCommand('copy'); }catch(e2){}
    window.getSelection().removeAllRanges();
  }
  btn.textContent = ok ? '✓ 복사됨' : '복사 실패';
  btn.classList.add('copied');
  setTimeout(() => { btn.textContent = '📋 복사'; btn.classList.remove('copied'); }, 1500);
}

/* ═══════════════════════════════════════════════════════════════════════════
   [Excel(.xlsx) 생성] — 라이브러리 없이 OOXML 직접 생성
   · 선택 근거: SheetJS 커뮤니티판은 조건부 서식·데이터 유효성(드롭다운)을
     지원하지 않고(Pro 전용) 인라인 삽입 시 파일이 1MB 이상 커짐.
     필요한 스펙(인쇄 설정·드롭다운·조건부 서식)이 명확하므로 직접 생성이
     파일 크기(수십 KB)와 안정성 모두 유리함.
   · ZIP은 무압축(STORE) 방식 — CRC32만 계산하면 되어 구현이 단순·안전함.
   ═══════════════════════════════════════════════════════════════════════════ */

/* CRC32 */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for(let n = 0; n < 256; n++){
    let c = n;
    for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for(let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

/* 무압축 ZIP 생성: files = [{name, text}] */
function buildZip(files){
  const enc = new TextEncoder();
  const now = new Date();
  const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | Math.floor(now.getSeconds() / 2);
  const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  const locals = [], centrals = [];
  let offset = 0;

  for(const f of files){
    const nameU8 = enc.encode(f.name);
    const dataU8 = enc.encode(f.text);
    const crc = crc32(dataU8);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);          // version needed
    lh.setUint16(6, 0x0800, true);      // UTF-8 flag
    lh.setUint16(8, 0, true);           // method: store
    lh.setUint16(10, dosTime, true);
    lh.setUint16(12, dosDate, true);
    lh.setUint32(14, crc, true);
    lh.setUint32(18, dataU8.length, true);
    lh.setUint32(22, dataU8.length, true);
    lh.setUint16(26, nameU8.length, true);
    lh.setUint16(28, 0, true);
    locals.push(new Uint8Array(lh.buffer), nameU8, dataU8);

    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true);
    ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true);
    ch.setUint32(16, crc, true);
    ch.setUint32(20, dataU8.length, true); ch.setUint32(24, dataU8.length, true);
    ch.setUint16(28, nameU8.length, true);
    ch.setUint32(42, offset, true);
    centrals.push(new Uint8Array(ch.buffer), nameU8);
    offset += 30 + nameU8.length + dataU8.length;
  }
  const cdSize = centrals.reduce((s, a) => s + a.length, 0);
  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true);
  eocd.setUint16(8, files.length, true);
  eocd.setUint16(10, files.length, true);
  eocd.setUint32(12, cdSize, true);
  eocd.setUint32(16, offset, true);

  const parts = [...locals, ...centrals, new Uint8Array(eocd.buffer)];
  const total = parts.reduce((s, a) => s + a.length, 0);
  const out = new Uint8Array(total);
  let p = 0;
  for(const a of parts){ out.set(a, p); p += a.length; }
  return out;
}

function buildWorkbook(){

  const name   = $('inpName').value.trim();
  const start  = $('inpStart').value, end = $('inpEnd').value;
  const budget = $('inpBudget').value;
  const {active} = computeEffective();
  const showBudget = active.has('P3');
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

  const sheetRows = [];   // {cells:[{col,xf,text}], ht, merges:[]}
  const merges = [];
  let r = 0;
  const addRow = (cells, ht) => { sheetRows.push({cells, ht}); return ++r; };

  // ── 상단: 캠페인 개요 블록 ──
  addRow(COLS.map(c => ({col:c, xf:XF.TITLE, text: c==='A' ? `${name} — 캠페인 체크리스트` : ''})), 30);
  merges.push('A1:H1');

  const ovRow = (l1, v1, l2, v2) => {
    const rr = r + 1;
    addRow([
      {col:'A', xf:XF.OV_LABEL, text:l1},
      {col:'B', xf:XF.OV_VALUE, text:v1}, {col:'C', xf:XF.OV_VALUE, text:''}, {col:'D', xf:XF.OV_VALUE, text:''},
      {col:'E', xf:XF.OV_LABEL, text:l2},
      {col:'F', xf:XF.OV_VALUE, text:v2}, {col:'G', xf:XF.OV_VALUE, text:''}, {col:'H', xf:XF.OV_VALUE, text:''},
    ], 20);
    merges.push(`B${rr}:D${rr}`, `F${rr}:H${rr}`);
  };
  ovRow('캠페인명', name, '캠페인 기간', `${start} ~ ${end}`);
  ovRow('생성일', todayStr,
    showBudget ? '예산 총액' : '상태 기준',
    showBudget ? (budget ? Number(budget).toLocaleString('ko-KR') + ' 원' : '(미입력)') : '미착수 / 진행중 / 완료 / N.A');

  const modLine = MODULES.filter(m => active.has(m.code)).map(m => m.code).join(' · ');
  const chLine  = CHANNELS.filter(c => state.channels.has(c.code)).map(c => `${c.code} ${c.name}`).join(' · ') || '(없음)';
  const wideRow = (label, text) => {
    const rr = r + 1;
    addRow([
      {col:'A', xf:XF.OV_LABEL, text:label},
      ...COLS.slice(1).map(c => ({col:c, xf:XF.OV_VALUE, text: c==='B' ? text : ''})),
    ], Math.max(20, Math.ceil(text.length / 55) * 15 + 6));
    merges.push(`B${rr}:H${rr}`);
  };
  wideRow('선택 모듈', modLine);
  wideRow('노출 채널', chLine);

  addRow(COLS.map(c => ({col:c, xf:XF.DEFAULT, text:''})), 8); // 여백

  // ── 헤더 행 (인쇄 반복) ──
  const headerRowNum = r + 1;
  addRow([
    {col:'A', xf:XF.HEADER, text:'단계'},   {col:'B', xf:XF.HEADER, text:'NO.'},
    {col:'C', xf:XF.HEADER, text:'과업'},   {col:'D', xf:XF.HEADER, text:'체크리스트'},
    {col:'E', xf:XF.HEADER, text:'협업부서'},{col:'F', xf:XF.HEADER, text:'기한(D-)'},
    {col:'G', xf:XF.HEADER, text:'상태'},   {col:'H', xf:XF.HEADER, text:'비고'},
  ], 22);

  // ── 데이터 행 ──
  const dataFirst = r + 1;
  for(let i = 0; i < rows.length; i++){
    const row = rows[i];
    const rr = r + 1;
    const stageXf = STAGE_XF[row.stage];
    const isFirst = i === 0 || rows[i-1].stage !== row.stage;
    if(isFirst){
      let span = 1;
      while(i + span < rows.length && rows[i+span].stage === row.stage) span++;
      if(span > 1) merges.push(`A${rr}:A${rr + span - 1}`);
    }
    const est = Math.max(row.checklist.length / 26, row.task.length / 11, row.note.length / 13, 1);
    addRow([
      {col:'A', xf:stageXf, text: isFirst ? row.stage : ''},
      {col:'B', xf:XF.BODY_C, text:row.no},
      {col:'C', xf:XF.BODY,   text:row.task},
      {col:'D', xf:XF.BODY,   text:row.checklist},
      {col:'E', xf:XF.BODY_C, text:row.dept},
      {col:'F', xf:XF.BODY_C, text:row.due},
      {col:'G', xf:XF.STATUS, text:row.status},
      {col:'H', xf:XF.NOTE,   text:row.note},
    ], Math.max(19, Math.ceil(est) * 14 + 5));
  }
  const dataLast = r;

  // ── sheet1.xml ──
  let sheetData = '';
  sheetRows.forEach((sr, idx) => {
    const rn = idx + 1;
    sheetData += `<row r="${rn}" ht="${sr.ht}" customHeight="1">` +
      sr.cells.map(c => cellStr(c.col + rn, c.xf, c.text)).join('') + '</row>';
  });

  const sheetXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>
<dimension ref="A1:H${dataLast}"/>
<sheetViews><sheetView workbookViewId="0" showGridLines="0"><pane ySplit="${headerRowNum}" topLeftCell="A${headerRowNum+1}" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>
<sheetFormatPr defaultRowHeight="18"/>
<cols>
<col min="1" max="1" width="7.5" customWidth="1"/>
<col min="2" max="2" width="8" customWidth="1"/>
<col min="3" max="3" width="15" customWidth="1"/>
<col min="4" max="4" width="42" customWidth="1"/>
<col min="5" max="5" width="12" customWidth="1"/>
<col min="6" max="6" width="13" customWidth="1"/>
<col min="7" max="7" width="9" customWidth="1"/>
<col min="8" max="8" width="20" customWidth="1"/>
</cols>
<sheetData>${sheetData}</sheetData>
<mergeCells count="${merges.length}">${merges.map(m => `<mergeCell ref="${m}"/>`).join('')}</mergeCells>
<conditionalFormatting sqref="G${dataFirst}:G${dataLast}">
<cfRule type="cellIs" dxfId="0" priority="1" operator="equal"><formula>"완료"</formula></cfRule>
<cfRule type="cellIs" dxfId="1" priority="2" operator="equal"><formula>"진행중"</formula></cfRule>
<cfRule type="cellIs" dxfId="2" priority="3" operator="equal"><formula>"N.A"</formula></cfRule>
</conditionalFormatting>
<dataValidations count="1">
<dataValidation type="list" allowBlank="1" showInputMessage="1" showErrorMessage="1" sqref="G${dataFirst}:G${dataLast}"><formula1>"미착수,진행중,완료,N.A"</formula1></dataValidation>
</dataValidations>
<printOptions horizontalCentered="1"/>
<pageMargins left="0.35" right="0.35" top="0.55" bottom="0.55" header="0.3" footer="0.3"/>
<pageSetup paperSize="9" orientation="portrait" fitToWidth="1" fitToHeight="0" horizontalDpi="300" verticalDpi="300"/>
</worksheet>`;

  const workbookXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets><sheet name="체크리스트" sheetId="1" r:id="rId1"/></sheets>
<definedNames>
<definedName name="_xlnm.Print_Area" localSheetId="0">'체크리스트'!$A$1:$H$${dataLast}</definedName>
<definedName name="_xlnm.Print_Titles" localSheetId="0">'체크리스트'!$${headerRowNum}:$${headerRowNum}</definedName>
</definedNames>
</workbook>`;

  const files = [
    {name:'[Content_Types].xml', text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>
<Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>
</Types>`},
    {name:'_rels/.rels', text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>
<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/>
</Relationships>`},
    {name:'docProps/core.xml', text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/">
<dc:title>${xesc(name)} 캠페인 체크리스트</dc:title><dc:creator>마케팅 캠페인 운영 SOP v3.0</dc:creator>
</cp:coreProperties>`},
    {name:'docProps/app.xml', text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties"><Application>Campaign SOP Checklist Generator</Application></Properties>`},
    {name:'xl/workbook.xml', text:workbookXml},
    {name:'xl/_rels/workbook.xml.rels', text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>
<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`},
    {name:'xl/styles.xml', text:stylesXml()},
    {name:'xl/worksheets/sheet1.xml', text:sheetXml},
  ];
  return buildZip(files);
}

/* ── 다운로드 ── */
$('btnDownload').addEventListener('click', () => {
  const msg = $('dlMsg');
  const name = $('inpName').value.trim();
  const missing = [];
  if(!name) missing.push('캠페인명');
  if(!$('inpStart').value) missing.push('시작일');
  if(!$('inpEnd').value) missing.push('종료일');
  if(missing.length){
    msg.textContent = '⚠ 필수 입력 누락: ' + missing.join(', ');
    $('secInfo').scrollIntoView({behavior:'smooth'});
    return;
  }
  if($('inpEnd').value < $('inpStart').value){
    msg.textContent = '⚠ 종료일이 시작일보다 빠릅니다.';
    return;
  }
  msg.textContent = '';
  const buf = buildWorkbook();
  const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = excelFileName(name);
  document.body.appendChild(a);
  a.click();
  const url = a.href;
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 3000);
});

/* 초기 렌더 */
renderAll();
</script>
</body>
</html>
